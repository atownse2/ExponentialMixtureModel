[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exponential-mixture-model"
version = "0.1.0"
description = "Finite exponential mixture model tools built on ROOT"
readme = "README.md"
requires-python = ">=3.9"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["emm", "tools"]
